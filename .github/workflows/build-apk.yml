name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build App
        run: |
          mkdir -p www
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/local-notifications@latest --legacy-peer-deps
          npx cap init BoRaed com.boraed.prayer --web-dir=www
          npx cap add android
          if [ -f icon.png ]; then
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp icon.png android/app/src/main/res/$d/ic_launcher.png
              cp icon.png android/app/src/main/res/$d/ic_launcher_round.png
              cp icon.png android/app/src/main/res/$d/ic_launcher_foreground.png
            done
          fi
          mkdir -p android/app/src/main/res/raw
          # انسخ الأصوات إذا موجودة في www
          if [ -d www/sounds ]; then cp www/sounds/* android/app/src/main/res/raw/ 2>/dev/null || true; fi
          if [ -d www/audio ]; then cp www/audio/* android/app/src/main/res/raw/ 2>/dev/null || true; fi
          if [ -d www/assets ]; then find www/assets -name "*.mp3" -exec cp {} android/app/src/main/res/raw/ \; 2>/dev/null || true; fi
          cp MainActivity.java android/app/src/main/java/com/boraed/prayer/MainActivity.java
          python3 - << 'PY'
          import pathlib
          mf_path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          mf = mf_path.read_text()
          perms = """
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          """
          if "POST_NOTIFICATIONS" not in mf:
              mf = mf.replace("<application", perms + "\n <application")
          receiver = ' <receiver android:name=".MainActivity$AlarmReceiver" android:enabled="true" android:exported="false" />'
          if "AlarmReceiver" not in mf:
              mf = mf.replace("</application>", receiver + "\n </application>")
          mf_path.write_text(mf)
          print("manifest fixed")
          PY
          npx cap sync android
          cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: BoRaed-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
