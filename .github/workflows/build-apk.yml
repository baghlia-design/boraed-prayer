name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build App
        run: |
          mkdir -p www
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/local-notifications@latest @capacitor/status-bar@latest --legacy-peer-deps
          npx cap init BoRaed com.boraed.prayer --web-dir=www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: BoRaed-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
