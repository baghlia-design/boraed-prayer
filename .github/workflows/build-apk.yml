name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/android@5 @capacitor/local-notifications@5
          npx cap add android || true
          npx cap copy

      - name: Add Silent Plugin & Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/INTERNET" \/>/INTERNET" \/>\n <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" \/>\n <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>/' $MANIFEST

          mkdir -p android/app/src/main/java/com/boraed/prayer
          cat > android/app/src/main/java/com/boraed/prayer/SilentPlugin.java << 'EOF'
          package com.boraed.prayer;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioManager;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.*;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "SilentMode")
          public class SilentPlugin extends Plugin {
              @PluginMethod
              public void requestPermission(PluginCall call) {
                  NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&!nm.isNotificationPolicyAccessGranted()) {
                      Intent intent = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
                      getActivity().startActivity(intent);
                  }
                  JSObject ret = new JSObject();
                  ret.put("granted", nm.isNotificationPolicyAccessGranted());
                  call.resolve(ret);
              }
              @PluginMethod
              public void enableSilent(PluginCall call) {
                  try {
                      AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                      NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                      am.setRingerMode(AudioManager.RINGER_MODE_SILENT);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && nm.isNotificationPolicyAccessGranted()) {
                          nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE);
                      }
                      call.resolve();
                  } catch (Exception e){ call.reject(e.getMessage()); }
              }
              @PluginMethod
              public void disableSilent(PluginCall call) {
                  try {
                      AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                      NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                      am.setRingerMode(AudioManager.RINGER_MODE_NORMAL);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && nm.isNotificationPolicyAccessGranted()) {
                          nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                      }
                      call.resolve();
                  } catch (Exception e){ call.reject(e.getMessage()); }
              }
          }
          EOF

          MAIN=$(find android -name MainActivity.java | head -n 1)
          echo "Found $MAIN"
          sed -i 's/import com.getcapacitor.BridgeActivity;/import com.getcapacitor.BridgeActivity;\nimport com.boraed.prayer.SilentPlugin;/' $MAIN
          sed -i 's/public class MainActivity extends BridgeActivity {/public class MainActivity extends BridgeActivity {\n @Override\n public void onCreate(android.os.Bundle savedInstanceState) {\n super.onCreate(savedInstanceState);\n registerPlugin(SilentPlugin.class);\n }/' $MAIN

      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BoRaed-APK-Silent-Fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
