name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          echo {\"appId\":\"com.boraed.prayer\",\"appName\":\"BoRaed\",\"webDir\":\"www\"} > capacitor.config.json
          mkdir -p www
          echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>BoRaed</title></head><body><h1>BoRaed Working</h1></body></html>" > www/index.html
          echo {\"name\":\"app\",\"dependencies\":{\"@capacitor/core\":\"5.6.0\",\"@capacitor/android\":\"5.6.0\",\"@capacitor/local-notifications\":\"5.0.3\"}} > package.json
          rm -rf android node_modules package-lock.json
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BoRaed-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
