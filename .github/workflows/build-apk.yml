name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build App
        run: |
          mkdir -p www
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/local-notifications@latest --legacy-peer-deps
          npx cap init BoRaed com.boraed.prayer --web-dir=www
          npx cap add android
          if [ -f icon.png ]; then
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp icon.png android/app/src/main/res/$d/ic_launcher.png
              cp icon.png android/app/src/main/res/$d/ic_launcher_round.png
              cp icon.png android/app/src/main/res/$d/ic_launcher_foreground.png
            done
          fi
          cat > android/app/src/main/java/com/boraed/prayer/MainActivity.java << 'JAVA'
          package com.boraed.prayer;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.PendingIntent;
import android.content.Context;
import android.content.Intent;
import android.media.AudioManager;
import android.os.Build;
import android.os.Bundle;
import android.os.Handler;
import android.os.VibrationEffect;
import android.os.Vibrator;
import android.view.View;
import android.view.WindowManager;
import android.webkit.JavascriptInterface;
import androidx.core.app.NotificationCompat;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    private int previousRingerMode = AudioManager.RINGER_MODE_NORMAL;
    private Handler handler = new Handler();
    private Runnable restoreRunnable;
    public static final String CHANNEL_ID = "silent_mode_channel";
    public static final int NOTIF_ID = 1001;

    @Override public void onCreate(Bundle s){
        super.onCreate(s);
        getWindow().setFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
        hide();
        createChannel();
        getBridge().getWebView().addJavascriptInterface(new SilentBridge(), "AndroidSilent");
    }
    void hide(){ getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN); }
    @Override public void onWindowFocusChanged(boolean f){ super.onWindowFocusChanged(f); if(f) hide(); }

    void createChannel(){
        if(Build.VERSION.SDK_INT >= Build.VERSION_CODES.O){
            NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "الصامت", NotificationManager.IMPORTANCE_LOW);
            ch.setDescription("التحكم في وضع الصامت بعد الأذان");
            ((NotificationManager)getSystemService(Context.NOTIFICATION_SERVICE)).createNotificationChannel(ch);
        }
    }

    public class SilentBridge {
        @JavascriptInterface public void vibrate(int ms){
            runOnUiThread(() -> {
                Vibrator v = (Vibrator)getSystemService(Context.VIBRATOR_SERVICE);
                if(v==null) return;
                if(Build.VERSION.SDK_INT >= Build.VERSION_CODES.O){
                    v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                } else {
                    v.vibrate(ms);
                }
            });
        }

        @JavascriptInterface public void setSilent(int minutes){
            runOnUiThread(() -> {
                AudioManager am = (AudioManager)getSystemService(Context.AUDIO_SERVICE);
                previousRingerMode = am.getRingerMode();
                am.setRingerMode(AudioManager.RINGER_MODE_SILENT);

                // إلغاء أي مؤقت سابق
                if(restoreRunnable != null) handler.removeCallbacks(restoreRunnable);

                // إظهار نافذة صغيرة (إشعار دائم) فيها زر إنهاء
                showOngoingNotification(minutes);

                restoreRunnable = () -> {
                    am.setRingerMode(previousRingerMode);
                    cancelNotification();
                };
                handler.postDelayed(restoreRunnable, minutes * 60 * 1000L);
            });
        }

        @JavascriptInterface public void cancelSilent(){
            runOnUiThread(() -> {
                if(restoreRunnable != null) handler.removeCallbacks(restoreRunnable);
                AudioManager am = (AudioManager)getSystemService(Context.AUDIO_SERVICE);
                am.setRingerMode(previousRingerMode);
                cancelNotification();
            });
        }

        @JavascriptInterface public boolean hasPermission(){
            NotificationManager nm = (NotificationManager)getSystemService(Context.NOTIFICATION_SERVICE);
            return nm.isNotificationPolicyAccessGranted();
        }
        @JavascriptInterface public void requestPermission(){
            startActivity(new Intent(android.provider.Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
        }
    }

    void showOngoingNotification(int minutes){
        Intent cancelIntent = new Intent(this, MainActivity.class);
        cancelIntent.setAction("CANCEL_SILENT");
        PendingIntent pi = PendingIntent.getActivity(this, 0, cancelIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

        NotificationCompat.Builder b = new NotificationCompat.Builder(this, CHANNEL_ID)
            .setSmallIcon(getApplicationInfo().icon)
            .setContentTitle("وضع الصامت مفعّل")
            .setContentText("ينتهي بعد "+minutes+" دقيقة - اضغط للإنهاء الآن")
            .setOngoing(true)
            .addAction(0, "إنهاء الصامت الآن", pi);

        ((NotificationManager)getSystemService(Context.NOTIFICATION_SERVICE)).notify(NOTIF_ID, b.build());
    }
    void cancelNotification(){
        ((NotificationManager)getSystemService(Context.NOTIFICATION_SERVICE)).cancel(NOTIF_ID);
    }
    @Override protected void onNewIntent(Intent intent){
        super.onNewIntent(intent);
        if(intent != null && "CANCEL_SILENT".equals(intent.getAction())){
            AudioManager am = (AudioManager)getSystemService(Context.AUDIO_SERVICE);
            am.setRingerMode(previousRingerMode);
            if(restoreRunnable != null) handler.removeCallbacks(restoreRunnable);
            cancelNotification();
        }
    }
}
          JAVA
          sed -i '/<application/i <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n <uses-permission android:name="android.permission.WAKE_LOCK" />\n <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />\n <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: BoRaed-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
