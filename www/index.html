<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoRaed - تنبيه الصلاة</title>
<script type="module" src="https://unpkg.com/@capacitor/core@5.6.0/dist/capacitor.js"></script>
<style>
  body{font-family:tahoma;background:#0f172a;color:#fff;text-align:center;padding:20px;margin:0}
  h1{color:#22c55e}
  .card{background:#1e293b;padding:18px;border-radius:14px;margin:12px 0;text-align:right;border-right:4px solid #22c55e}
  button{background:#22c55e;color:#000;padding:16px;width:100%;border-radius:12px;border:none;font-size:19px;font-weight:bold;margin-top:15px}
  .ok{color:#22c55e} .bad{color:#ef4444}
  small{opacity:.6}
</style>
</head>
<body>
<h1>🕌 بورد - تنبيه الصلاة</h1>
<div class="card" id="perm">⏳ جاري طلب الأذونات...</div>
<div class="card">الفجر: <b id="fajr">--:--</b><br>العصر: <b id="asr">--:--</b></div>
<div class="card"><b>كيف يعمل؟</b><br>• يرسل إشعار حتى لو الشاشة مطفية والتطبيق مقفل<br>• يفعل الصامت تلقائياً لمدة 25 دقيقة</div>
<button onclick="test()">🔔 جرب الآن (بعد 10 ثواني - اطفي الشاشة)</button>
<small>مهم: بعد التثبيت اذهب للاعدادات > البطارية > التطبيق > اختر "عدم تقييد" ليعمل في الخلفية</small>

<script>
async function start(){
  const statusEl = document.getElementById('perm');
  try{
    const { LocalNotifications } = Capacitor.Plugins;
    const res = await LocalNotifications.requestPermissions();
    if(res.display === 'granted'){
      statusEl.innerHTML = '<span class="ok">✅ تم السماح - الإشعارات ستعمل في الخلفية حتى مع الشاشة مطفأة</span>';
      scheduleDaily();
    }else{
      statusEl.innerHTML = '<span class="bad">❌ لم تسمح بالإشعارات - ادخل اعدادات الجوال > التطبيقات > BoRaed > فعل الإشعارات</span>';
    }
  }catch(e){
    statusEl.innerHTML = 'خطأ: ' + e.message + '<br>تأكد أنك ثبت النسخة الجديدة';
  }
}

async function scheduleDaily(){
  const { LocalNotifications } = Capacitor.Plugins;
  await LocalNotifications.cancel({notifications:[{id:1},{id:2}]});
  let now = new Date();
  let fajr = new Date(); fajr.setHours(5,0,0,0);
  if(fajr < now) fajr.setDate(fajr.getDate()+1);
  let asr = new Date(); asr.setHours(15,30,0,0);
  if(asr < now) asr.setDate(asr.getDate()+1);
  
  document.getElementById('fajr').innerText = fajr.toLocaleTimeString('ar-EG');
  document.getElementById('asr').innerText = asr.toLocaleTimeString('ar-EG');

  await LocalNotifications.schedule({
    notifications:[
      {title:'🕌 حان وقت صلاة الفجر', body:'تم تفعيل وضع الصامت لمدة 25 دقيقة', id:1, schedule:{at:fajr.toISOString()}, sound:null, smallIcon:'ic_launcher', channelId:'prayer'},
      {title:'🕌 حان وقت صلاة العصر', body:'تم تفعيل وضع الصامت لمدة 25 دقيقة', id:2, schedule:{at:asr.toISOString()}, sound:null, smallIcon:'ic_launcher', channelId:'prayer'}
    ]
  });
}

async function test(){
  const { LocalNotifications } = Capacitor.Plugins;
  let d = new Date(Date.now()+10000);
  await LocalNotifications.schedule({notifications:[{title:'🔔 تجربة ناجحة!', body:'لو وصلك هذا والشاشة مطفية معناه التطبيق شغال 100% في الخلفية', id:99, schedule:{at:d.toISOString()}}]});
  alert('تم جدولة تنبيه بعد 10 ثواني - الآن اطف الشاشة فورا وانتظر');
}

start();
</script>
</body>
</html>
