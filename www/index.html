<!DOCTYPE html>
<html dir="rtl">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;height:100%;background:#0f172a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center}.card{background:#1e293b;padding:20px;border-radius:16px;width:90%;max-width:400px;text-align:center}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155} button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:#10b981;color:#fff}</style>
</head>
<body>
<div class="card">
<h1>🕌 مواقيت المبرز</h1>
<div id="t">جاري التحميل...</div>
<button onclick="test()">جرب تنبيه 10ث</button>
</div>
<script type="module">
import {LocalNotifications} from 'https://cdn.jsdelivr.net/npm/@capacitor/local-notifications@6/+esm';
import {StatusBar} from 'https://cdn.jsdelivr.net/npm/@capacitor/status-bar@6/+esm';
try{await StatusBar.hide()}catch(e){}
async function load(){
 let r=await fetch('https://api.aladhan.com/v1/timingsByCity?city=Al%20Mubarraz&country=Saudi%20Arabia&method=4');
 let d=await r.json(); let tm=d.data.timings;
 document.getElementById('t').innerHTML=`الفجر ${tm.Fajr}<br>الظهر ${tm.Dhuhr}<br>العصر ${tm.Asr}<br>المغرب ${tm.Maghrib}<br>العشاء ${tm.Isha}`;
 await LocalNotifications.requestPermissions();
 let n=[]; let id=1;
 for(let [name,time] of [['الفجر',tm.Fajr],['الظهر',tm.Dhuhr],['العصر',tm.Asr],['المغرب',tm.Maghrib],['العشاء',tm.Isha]]){
  let [h,m]=time.split(':').map(Number); let dd=new Date(); dd.setHours(h,m,0,0); if(dd<=new Date()) dd.setDate(dd.getDate()+1);
  n.push({title:`حان وقت ${name}`,body:`صلاة ${name}`,id:id++,schedule:{at:dd.toISOString()}});
 }
 await LocalNotifications.schedule({notifications:n});
}
window.test=async()=>{
 await LocalNotifications.requestPermissions();
 await LocalNotifications.schedule({notifications:[{title:'اختبار',body:'شغال ✅',id:99,schedule:{at:new Date(Date.now()+10000).toISOString()}}]});
};
load();
</script>
</body>
</html>
